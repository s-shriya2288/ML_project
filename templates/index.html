<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chillar ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Same calm cream-and-forest look as the Chillar web app. The ML pages add one accent (lilac) for anything a model produced. */
:root{
  --bg:#F6F3EA; --surface:#FFFDF7; --surface-2:#EFEBDD; --line:#E3DECD;
  --ink:#1D2A21; --ink-2:#4D5A50; --muted:#7A857C;
  --forest:#2E5B3C; --on-forest:#FBFAF3; --sage:#8DAE89; --mint:#DEEBD4; --mint-2:#C7DDBA;
  --butter:#F1D373; --butter-soft:#FBF1CB; --coral:#D96F55; --coral-soft:#F8E0D7; --amber:#C98F22;
  --ai:#6B5BB8; --ai-soft:#ECE8F8; --ai-2:#B3A8E0;
  --shadow:0 1px 2px rgba(29,42,33,.05),0 10px 30px -12px rgba(29,42,33,.14);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --f-body:"Figtree","Avenir Next",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111713; --surface:#18201B; --surface-2:#212B24; --line:#2B362E; --ink:#EAF0E6; --ink-2:#B6C2B5; --muted:#86928A;
  --forest:#93CC9D; --on-forest:#0E1A12; --sage:#6C9170; --mint:#21352A; --mint-2:#2C4635;
  --butter:#E6C65A; --butter-soft:#383120; --coral:#EE8D72; --coral-soft:#3B241E; --amber:#E2AE4C;
  --ai:#B8ACF0; --ai-soft:#262238; --ai-2:#6F63A8; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--forest);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:26px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--forest);color:var(--on-forest);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand-name b{color:var(--ai)}
.brand-sub{font-size:12px;color:var(--muted);margin-top:-4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:0;background:none;text-align:left;color:var(--ink-2);font-weight:650;width:100%}
.nav:hover{background:var(--surface-2)}
.nav[aria-current]{background:var(--mint);color:var(--ink)}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.nav[aria-current] .dot{background:var(--forest)}
.nav.ai .dot{background:var(--ai-2)}
.nav.ai[aria-current]{background:var(--ai-soft)}
.nav.ai[aria-current] .dot{background:var(--ai)}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 10px}
main{min-width:0;padding:28px 36px 60px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  main{padding:18px max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
  .tab{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:650;padding:10px 0}
  .tab[aria-current]{color:var(--forest)}.tab.ai[aria-current]{color:var(--ai)}
}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:clamp(26px,4.4vw,36px);font-weight:800;line-height:1.1}
.topbar p{margin:4px 0 0;color:var(--ink-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:650;white-space:nowrap}
.chip.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.ai{border-color:color-mix(in srgb,var(--ai) 30%,var(--line));background:linear-gradient(170deg,var(--ai-soft),var(--surface) 60%)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:650}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-home{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:650}
.stat .v{font-size:23px;font-weight:800;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--muted)}
@media (max-width:1060px){.g-home{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:10px 17px;border:1px solid transparent;font-weight:650;font-size:14.5px;line-height:1.2;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--forest);color:var(--on-forest)}
.btn-soft{background:var(--mint);color:var(--ink)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ai{background:var(--ai);color:#fff}
.btn-danger{background:var(--coral-soft);color:var(--coral)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,select.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.input:focus{outline:none;border-color:var(--forest)}
label.lb{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:0 0 4px}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--forest);transition:width .6s}
.bar.ai i{background:var(--ai)}.bar.over i{background:var(--coral)}.bar.warm i{background:var(--butter)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.tap{cursor:pointer;border-radius:12px;margin:0 -8px;padding-left:8px;padding-right:8px}
.row.tap:hover{background:var(--surface-2)}
.rm{flex:1;min-width:0}
.rt{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-family:var(--f-display);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.cdot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ai{background:var(--ai-soft);color:var(--ai)}.pill.ok{background:var(--mint);color:var(--forest)}.pill.warn{background:var(--butter-soft);color:var(--amber)}.pill.over{background:var(--coral-soft);color:var(--coral)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--butter-soft);flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.today{background:var(--forest);color:var(--on-forest);border:0;position:relative;overflow:hidden}
.today .big{font-size:clamp(44px,8vw,64px);font-weight:800;line-height:1}
.today .sub{opacity:.8}
.meter{height:14px;border-radius:99px;background:color-mix(in srgb,var(--on-forest) 18%,transparent);overflow:hidden;margin:16px 0 6px}
.meter i{display:block;height:100%;background:var(--butter);border-radius:99px}
.meter i.over{background:var(--coral)}
.today .msg{background:color-mix(in srgb,var(--on-forest) 12%,transparent);padding:10px 14px;border-radius:14px;margin:12px 0}
.today .btn-ghost{border-color:color-mix(in srgb,var(--on-forest) 35%,transparent);color:var(--on-forest)}
.today .btn-light{background:var(--on-forest);color:var(--forest)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;min-height:28px;align-items:center}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:650}
.sugg button.on{background:var(--ai);color:#fff;border-color:transparent}
.sugg .lab{font-size:12px;color:var(--ai);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.cm{border-collapse:collapse;font-size:11.5px;width:100%}
.cm th,.cm td{padding:5px 4px;text-align:center}
.cm th{color:var(--muted);font-weight:650}
.cm th.rl{text-align:right;white-space:nowrap}
.cm td{border-radius:6px;font-family:var(--f-mono)}
.cm-wrap{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:650}
.vs{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.hbar .t{height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.hbar .t i{position:absolute;top:0;bottom:0;border-radius:99px}
.gauge{display:flex;align-items:center;gap:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:center}
.badge .m{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--butter),var(--amber));color:#3B2A06;font-weight:800}
.badge.off .m{background:var(--surface-2);color:var(--muted)}
.badge b{display:block;font-size:13px;font-family:var(--f-display)}.badge span{font-size:11.5px;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,18,12,.45);display:grid;place-items:center;padding:20px}
.sheet{width:min(500px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:24px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:4px}
.choice{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-top:10px}
.choice:hover{border-color:var(--forest)}
.choice b{display:block}.choice span{font-size:13px;color:var(--muted)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(460px,calc(100vw - 32px))}
@media (max-width:860px){.toasts{bottom:96px}}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.3)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--surface-2),var(--bg),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.explain{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.setup{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.setup-card{width:min(540px,100%)}
.setup h1{font-size:clamp(32px,6vw,44px);font-weight:800;line-height:1.05;margin:12px 0}
.setup h1 em{font-style:normal;color:var(--ai)}
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet"></div>
<div class="toasts" id="toasts"></div>
<script>
const PAGES = [["home","Home"],["expenses","Expenses"],["savings","Savings"],["predict","AI Insights",1],["lab","ML Lab",1],["profile","Profile"]];
const COLORS = {food:"#D9952B",transport:"#4F86B5",shopping:"#C25F88",entertainment:"#8664C2",education:"#2F9481",personal:"#9A9330",bills:"#D46A45",other:"#7F8A82"};
let S = null, INS = null, LAB = null, page = (location.hash.slice(1) || "home"), filter = "week", catTouched = false, sugT = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n < 0 ? "−" : "") + "₹" + Math.abs(Math.round(n * 100) / 100).toLocaleString("en-IN");
const pct = n => Math.round(n * 100) + "%";
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dname = s => { const t = today(); const y = new Date(Date.now() - 864e5); const ys = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
  return s === t ? "Today" : s === ys ? "Yesterday" : new Date(s + "T00:00").toLocaleDateString("en-IN", {weekday:"short", day:"numeric", month:"short"}); };
const short = s => new Date(s + "T00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short"});

// Your data lives only in this browser. Every request sends it to the (stateless) server, which applies the money
// rules, runs the models and returns the updated data.
let STATE = null;
try { STATE = JSON.parse(localStorage.getItem("chillarml.state") || "null"); } catch {}
function keep() { try { localStorage.setItem("chillarml.state", JSON.stringify(STATE)); } catch { toast("Couldn't save in this browser (private mode?). Changes last until you close the tab."); } }
async function api(path, extra = {}) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({state: STATE, ...extra})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(esc(j.error || "Something went wrong.")); throw new Error(j.error); }
  return j;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 3800); }
async function apply(promise, msg) {
  const j = await promise; STATE = j.state; S = j.snap; keep(); INS = null; LAB = null; render(); if (msg) toast(msg);
}

/* ---------- charts (plain SVG) ---------- */
function barsSVG(rows, {h = 190, line = null, key = "v"} = {}) {
  const W = 640, pad = 26, n = rows.length;
  let max = Math.max(1, ...rows.map(r => Math.max(r.v || 0, r.p || 0)), line || 0) * 1.12;
  if (line) max = Math.min(max, line * 3.2); // one-off spikes would flatten every other bar, so they get clipped and labelled
  const slot = (W - 10) / n, bw = Math.min(30, slot * .62), base = h - pad;
  const y = v => base - (base - 10) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Daily spending chart">`;
  if (line) s += `<line x1="0" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${W-2}" y="${y(line)-5}" text-anchor="end" font-size="11" fill="var(--muted)">${money(line)}/day</text>`;
  rows.forEach((r, i) => {
    const x = 5 + i * slot + slot / 2;
    if (r.v != null && r.v > 0) { const vv = Math.min(r.v, max);
      s += `<rect x="${x-bw/2}" y="${y(vv)}" width="${bw}" height="${base-y(vv)}" rx="5" fill="${r.c || (line && r.v > line ? "var(--coral)" : "var(--sage)")}"><title>${r.l}: ${money(r.v)}</title></rect>`;
      if (r.v > max) s += `<text x="${x}" y="${y(vv) + 13}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">↑${money(r.v)}</text>`; }
    if (r.p != null) s += `<rect x="${x-bw/2}" y="${y(r.p)}" width="${bw}" height="${Math.max(1,base-y(r.p))}" rx="5" fill="var(--ai-soft)" stroke="var(--ai)" stroke-dasharray="3 3"><title>${r.l}: predicted ${money(r.p)}</title></rect>`;
    if (n <= 16 || i % 2 === 0) s += `<text x="${x}" y="${h-8}" text-anchor="middle" font-size="11" fill="${r.hi ? "var(--ink)" : "var(--muted)"}" font-weight="${r.hi ? 700 : 400}">${r.l}</text>`;
  });
  return s + "</svg>";
}
function linesSVG(rows, h = 200) {
  const W = 640, pad = 24, max = Math.max(1, ...rows.flatMap(r => [r.actual, r.predicted])) * 1.1;
  const x = i => 12 + i * (W - 24) / Math.max(1, rows.length - 1), y = v => h - pad - (h - pad - 10) * v / max;
  const path = k => rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(r[k]).toFixed(1)}`).join("");
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Actual vs predicted on the test days">`;
  s += `<path d="${path("actual")}" fill="none" stroke="var(--sage)" stroke-width="2.5"/><path d="${path("predicted")}" fill="none" stroke="var(--ai)" stroke-width="2.5" stroke-dasharray="6 4"/>`;
  rows.forEach((r, i) => { s += `<circle cx="${x(i)}" cy="${y(r.actual)}" r="3.5" fill="var(--sage)"><title>${short(r.date)} actual ${money(r.actual)}, predicted ${money(r.predicted)}</title></circle>`;
    if (i % 3 === 0) s += `<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${short(r.date)}</text>`; });
  return s + "</svg>";
}
function gaugeSVG(p) {
  const a = Math.PI * (1 - p), cx = 70, cy = 70, r = 56;
  const col = p >= .6 ? "var(--coral)" : p >= .35 ? "var(--amber)" : "var(--forest)";
  return `<svg viewBox="0 0 140 84" width="150" aria-hidden="true"><path d="M14 70A56 56 0 0 1 126 70" fill="none" stroke="var(--surface-2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M14 70A56 56 0 0 1 ${(cx + r * Math.cos(a)).toFixed(1)} ${(cy - r * Math.sin(a)).toFixed(1)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>
    <text x="70" y="66" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="var(--ink)">${pct(p)}</text></svg>`;
}

/* ---------- shell ---------- */
function render() {
  if (S && S.setup) return renderSetup();
  if (!PAGES.some(p => p[0] === page)) page = "home";
  const nav = PAGES.map(([id, l, ai]) => `<button class="nav ${ai ? "ai" : ""}" data-nav="${id}" ${id === page ? 'aria-current="page"' : ""}><span class="dot"></span>${l}</button>`).join("");
  const tabs = PAGES.map(([id, l, ai]) => `<button class="tab ${ai ? "ai" : ""}" data-nav="${id}" ${id === page ? 'aria-current="page"' : ""}>${{predict:"AI", lab:"Lab", expenses:"Spend", savings:"Jar", profile:"Me"}[id] || l}</button>`).join("");

  return `<div class="topbar"><div><h1>ML Lab</h1><p>How each model works and how well it does on data it has never seen.</p></div>
    <div class="chips"><span class="chip ai">trained in ${LAB.train_seconds}s</span><button class="btn btn-ai btn-sm" data-act="retrain">Retrain all</button></div></div>
  <section class="card ai"><div class="card-h"><h2>Try the classifier</h2></div><input class="input" id="try" placeholder="Type anything you might buy, e.g. dominos with roommates"><div class="sugg" id="try-out" style="margin-top:10px"></div></section>
  <div class="grid g2">
  <section class="card"><div class="card-h"><h2>1 · Category classifier</h2><span class="pill ai">supervised · text</span></div>
    <dl class="kv"><dt>Model</dt><dd>${esc(c.algorithm)}</dd><dt>Data</dt><dd>${c.n_samples} labelled notes (${c.n_seed} starter + yours), ${c.n_unique_phrases} distinct phrases</dd>
      <dt>Split</dt><dd>Grouped 75/25 by phrase, so test notes are never seen in training</dd><dt>Cross-val</dt><dd>${pct(c.cv_mean)} ± ${pct(c.cv_std)} accuracy (${c.cv_folds}-fold GroupKFold)</dd><dt>Macro F1</dt><dd>${c.macro_f1.toFixed(2)}</dd></dl>
    <div style="margin-top:12px">${vs("Accuracy", c.accuracy, c.baseline_accuracy)}</div><p class="explain" style="margin-top:0">Baseline: ${esc(c.baseline)}.</p>
    <div class="eyebrow" style="margin-top:14px">Confusion matrix (test set, rows = true)</div>
    <div class="cm-wrap"><table class="cm"><tr><th></th>${c.labels.map(l => `<th title="${esc(l)}">${esc(l.slice(0, 4))}</th>`).join("")}</tr>
      ${c.confusion.map((row, i) => `<tr><th class="rl">${esc(c.labels[i])}</th>${row.map((v, j) => `<td style="background:${v ? `color-mix(in srgb,${i === j ? "var(--ai)" : "var(--coral)"} ${Math.round(15 + 70 * v / cmMax)}%,transparent)` : "transparent"}">${v || "·"}</td>`).join("")}</tr>`).join("")}</table></div></section>
  <section class="card"><div class="card-h"><h2>2 · Spending forecaster</h2><span class="pill ai">supervised · regression</span></div>
    ${f.ready ? `<dl class="kv"><dt>Model</dt><dd>${esc(f.algorithm)}</dd><dt>Split</dt><dd>Time-ordered: train ${f.n_train} days, test the last ${f.n_test}</dd><dt>RMSE</dt><dd>${money(Math.round(f.rmse))} (baseline ${money(Math.round(f.baseline_rmse))})</dd><dt>Spikes</dt><dd>Days above ${money(Math.round(f.spike_cap))} are capped in training</dd></dl>
      <div style="margin-top:12px">${vs("MAE / day", f.mae, f.baseline_mae, true)}</div><p class="explain" style="margin-top:0">Baseline: ${esc(f.baseline)}. Lower is better.</p>
      <div class="eyebrow" style="margin-top:12px">Test days: actual (green) vs predicted (dashed)</div><div class="chart">${linesSVG(f.test_curve)}</div>
      <div class="eyebrow" style="margin:12px 0 4px">Feature importance</div>${hb(f.importance)}` : `<p class="muted">${esc(f.reason)}</p>`}</section>
  <section class="card"><div class="card-h"><h2>3 · Overspend risk</h2><span class="pill ai">supervised · classification</span></div>
    ${r.ready ? `<dl class="kv"><dt>Model</dt><dd>${esc(r.algorithm)}</dd><dt>Split</dt><dd>Time-ordered: train ${r.n_train} days, test ${r.n_test}</dd><dt>Overspend rate</dt><dd>${pct(r.base_rate)} of days</dd><dt>ROC AUC</dt><dd>${r.auc != null ? r.auc.toFixed(2) : "n/a (one class in test)"} <span class="muted">(0.5 = coin flip)</span></dd></dl>
      <div style="margin-top:12px">${vs("Accuracy", r.accuracy, r.baseline_accuracy)}</div><p class="explain" style="margin-top:0">Baseline: ${esc(r.baseline)}. Accuracy is misleading when overspend days are rare, so AUC is the number to watch.</p>
      <div class="eyebrow" style="margin:12px 0 4px">What pushes risk up (purple) or down (green)</div>${hb(r.drivers, true)}` : `<p class="muted">${esc(r.reason)}</p>`}</section>
  <section class="card"><div class="card-h"><h2>4 · Anomalies & 5 · Week types</h2><span class="pill ai">unsupervised</span></div>
    ${a.ready ? `<dl class="kv"><dt>Model</dt><dd>${esc(a.algorithm)}</dd><dt>Features</dt><dd>${a.features.join(", ")}</dd><dt>Result</dt><dd>${a.flagged} of ${a.n} expenses flagged</dd></dl>` : `<p class="muted">${esc(a.reason)}</p>`}
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    ${k.ready ? `<dl class="kv"><dt>Model</dt><dd>${esc(k.algorithm)}</dd><dt>Data</dt><dd>${k.n_weeks} weeks</dd><dt>Silhouette</dt><dd>${k.silhouette.toFixed(2)} <span class="muted">(−1 to 1, higher = cleaner clusters)</span></dd></dl>` : `<p class="muted">${esc(k.reason)}</p>`}
    <p class="explain">No labels needed: these find structure on their own. The anomaly detector spots one-off big spends, and the clusters name your week types on the AI Insights page.</p></section>
  </div>`;
}
function profile() {
  const p = S.profile;
  return `<div class="topbar"><div><h1>Profile</h1><p>Your allowance and your data.</p></div></div>
  <div class="grid g2"><section class="card"><div class="card-h"><h2>Settings</h2></div><form class="form" id="set-form">
    <div><label class="lb" for="s-name">Name</label><input class="input" id="s-name" value="${esc(p.name)}" maxlength="30"></div>
    <div class="two"><div><label class="lb" for="s-m">Monthly allowance</label><input class="input" id="s-m" type="number" min="1" value="${p.monthly}"></div><div><label class="lb" for="s-d">Daily allowance</label><input class="input" id="s-d" type="number" min="1" value="${p.daily}"></div></div>
    <div><button class="btn btn-primary" type="submit">Save</button></div></form></section>
  <section class="card"><div class="card-h"><h2>Your data</h2></div><p class="muted" style="margin-top:0">Virtual money only: no bank links, no payments. Your data stays in this browser; the server only uses it to answer each request and never stores it. Clearing browser data erases it.</p>
    ${window.ChillarAndroid ? "" : `<p style="margin:0 0 14px"><a class="btn btn-ai" href="/ChillarML.apk" download>Get the Android app</a></p><p class="explain" style="margin:-6px 0 14px">Adds automatic import from your UPI SMS. Open this page on your phone, download, then allow "Install unknown apps" for your browser.</p>`}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost" data-act="reset" data-s="1">Load example data</button><button class="btn btn-danger" data-act="reset" data-s="0">Start fresh</button></div></section></div>`;
}
function renderSetup() {
  $("#root").innerHTML = `<div class="setup"><div class="setup-card"><div class="brand" style="padding:0"><div class="brand-mark">₹</div><div><div class="brand-name">chillar<b>ML</b></div><div class="brand-sub">your money, predicted</div></div></div>
    <h1>Spend ₹150 a day. <em>Let the models do the maths.</em></h1>
    <p class="muted">A virtual daily allowance, a savings jar, and five machine-learning models that learn your spending habits.</p>
    <form class="card form" id="setup-form"><div><label class="lb" for="u-name">Your name</label><input class="input" id="u-name" maxlength="30" placeholder="Aanya"></div>
      <div class="two"><div><label class="lb" for="u-m">Monthly allowance</label><input class="input" id="u-m" type="number" min="1" value="6000"></div><div><label class="lb" for="u-d">Daily allowance</label><input class="input" id="u-d" type="number" min="1" value="150"></div></div>
      <label style="display:flex;gap:10px;font-size:14px"><input type="checkbox" id="u-s" checked> Load 4 months of example spending so the models can train right away</label>
      <button class="btn btn-primary" type="submit">Start →</button></form></div></div>`;
}

/* ---------- sheets ---------- */
function sheet(html) { $("#sheet").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $("#sheet").innerHTML = ""; }
function closingSheet(d) {
  const x = d === S.today.d ? S.today : S.pending.find(p => p.d === d); if (!x) return;
  sheet(`<h2>${d === S.today.d ? "Wrap up today" : dname(d) + " is closed"}</h2><p class="muted" style="margin:0 0 6px">Allowance ${money(x.allowance)} · spent ${money(x.spent)} · <b style="color:var(--forest)">${money(x.unused)} unused</b></p>
    <button class="choice" data-act="decide" data-d="${d}" data-c="save"><span><b>Save it</b><span>Move ${money(x.unused)} into your Savings Jar.</span></span></button>
    <button class="choice" data-act="decide" data-d="${d}" data-c="carry"><span><b>Carry it forward</b><span>Add it to the next day's spending balance.</span></span></button>
    <button class="choice" data-act="decide" data-d="${d}" data-c="later"><span><b>Decide later</b><span>Nothing moves until you choose.</span></span></button>`);
}
let sugN = 0;
async function suggestInto(note, box, form) {
  clearTimeout(sugT);
  sugT = setTimeout(async () => {
    if (!note.trim()) { box.innerHTML = ""; return; }
    const n = ++sugN; const s = await api("/api/suggest", {note});
    if (n !== sugN) return; // a newer keystroke already asked again
    box.innerHTML = `<span class="lab">Model thinks:</span>` + s.map((x, i) => `<button type="button" class="${i === 0 ? "on" : ""}" data-pick="${x.cat}">${esc(x.name)} · ${pct(x.p)}</button>`).join("");
    if (form && s[0] && !catTouched) form.querySelector("#f-cat").value = s[0].cat;
  }, 300);
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const nav = ev.target.closest("[data-nav]"); if (nav) { go(nav.dataset.nav); return; }
  const pick = ev.target.closest("[data-pick]"); const pf = pick?.closest("form"); if (pick && pf) { pf.querySelector("#f-cat").value = pick.dataset.pick; catTouched = true; pick.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === pick)); return; }
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "scrim" && ev.target !== el) return;
  switch (a) {
    case "add": catTouched = false; sheet(`<h2>Add expense</h2><p class="muted" style="margin:0 0 14px">The classifier suggests a category as you type.</p>${expForm()}`); setTimeout(() => $("#sheet #f-amt")?.focus(), 30); break;
    case "edit": { const e = S.expenses.find(x => x.id === id); catTouched = true; sheet(`<h2>Edit expense</h2>${expForm(e)}`); break; }
    case "del": closeSheet(); await apply(api("/api/do/delete", {id}), "Deleted."); break;
    case "close-sheet": case "scrim": closeSheet(); break;
    case "filter": filter = el.dataset.f; render(); break;
    case "close": closingSheet(el.dataset.d); break;
    case "decide": { const c = el.dataset.c; closeSheet(); await apply(api("/api/do/decide", {date: el.dataset.d, choice: c}), c === "save" ? "In the jar. Future you says thanks." : c === "carry" ? "Carried forward." : "Parked for later."); break; }
    case "goal-add": case "goal-fill": case "goal-back": { const g = S.goals.find(x => x.id === id);
      const amt = a === "goal-back" ? -g.saved : a === "goal-add" ? Math.min(100, S.jar.free, g.target - g.saved) : Math.min(S.jar.free, g.target - g.saved);
      if (amt) await apply(api("/api/do/goal_money", {id, amount: amt}), amt > 0 ? `${money(amt)} added to ${esc(g.name)}.` : "Moved back to your free jar."); break; }
    case "import-sms": importSms(); break;
    case "goal-del": await apply(api("/api/do/goal_delete", {id}), "Goal deleted."); break;
    case "retrain": LAB = null; render(); LAB = await api("/api/lab", {retrain: true}); INS = null; render(); toast(`All 5 models retrained in ${LAB.train_seconds}s.`); break;
    case "reset": if (confirm(el.dataset.s === "1" ? "Replace everything with example data?" : "Erase all expenses and savings and start fresh?")) await apply(api("/api/reset", {sample: el.dataset.s === "1"}), "Done."); break;
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "f-note") { const f = ev.target.closest("form"); suggestInto(ev.target.value, f.querySelector("#sugg"), f); }
  if (ev.target.id === "f-cat") catTouched = true;
  if (ev.target.id === "try") suggestInto(ev.target.value, $("#try-out"), false);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".row.tap")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === "exp-form") {
    const body = {amount: +f.querySelector("#f-amt").value, note: f.querySelector("#f-note").value, cat: f.querySelector("#f-cat").value, date: f.querySelector("#f-date").value, pay: f.querySelector("#f-pay").value};
    const eid = f.dataset.id; closeSheet();
    const j = await (eid ? api("/api/do/edit", {id: eid, ...body}) : api("/api/do/add", body));
    STATE = j.state; S = j.snap; keep(); INS = null; LAB = null; catTouched = false; render();
    const over = S.today.left < 0 && body.date === S.today.d;
    toast(eid ? "Expense updated." : `Logged ${money(body.amount)}.${over ? ` You're ${money(-S.today.left)} over today; it comes out of the monthly buffer.` : ""}`);
  }
  if (f.id === "stmt-form") {
    const fd = new FormData(); fd.append("file", f.querySelector("#stmt-file").files[0]); fd.append("password", f.querySelector("#stmt-pass").value); fd.append("state", JSON.stringify(STATE));
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Reading statement…";
    try {
      const r = await fetch("/api/import/statement", {method: "POST", body: fd}); const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(esc(j.error || "Couldn't import that file.")); return; }
      importDone(j);
    } finally { btn.disabled = false; btn.textContent = "Import statement"; }
  }
  if (f.id === "goal-form") await apply(api("/api/do/goal_add", {name: f.querySelector("#g-name").value, target: +f.querySelector("#g-target").value}), "Goal added.");
  if (f.id === "set-form") await apply(api("/api/do/settings", {name: $("#s-name").value, monthly: +$("#s-m").value, daily: +$("#s-d").value}), "Settings saved.");
  if (f.id === "setup-form") await apply(api("/api/setup", {name: $("#u-name").value, monthly: +$("#u-m").value, daily: +$("#u-d").value, sample: $("#u-s").checked}), "Welcome! Your first allowance is ready.");
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== page) { page = h; render(); } });
(async () => {
  if (!STATE) { S = {setup: true}; render(); return; }
  await apply(api("/api/snapshot"));
  if (S.pending && S.pending.some(p => !p.later)) closingSheet(S.pending.find(p => !p.later).d);
})();
</script>
</body>
</html>
